# netlify.toml at repo root
[build]
  base = "frontend"          # where package.json & index.html live
  command = "npm ci && npm run build"
  publish = "dist"           # Vite output dir

# SPA fallback (safe even though you use hash routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200